apiVersion: 1

datasources:
  # 1. Prometheus Telemetry Datasource
  - name: Prometheus
    type: prometheus
    uid: Prometheus
    access: proxy
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 5s

  # 2. Loki Centralized Logging Datasource
  - name: Loki
    type: loki
    uid: Loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
