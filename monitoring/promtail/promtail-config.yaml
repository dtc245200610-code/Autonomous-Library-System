server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Scrape Application Logs (Python Flask Structured Logs)
  - job_name: library_app
    static_configs:
      - targets:
          - localhost
        labels:
          job: library_app
          service: library_web
          __path__: /var/log/library/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
      - labels:
          level:
          logger:

  # 2. Scrape Nginx Access & Error Logs
  - job_name: library_nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: library_nginx
          service: nginx_gateway
          __path__: /var/log/nginx/*.log
