# ==============================================================================
# PROMETHEUS METRICS COLLECTION CONFIGURATION
# Tiêu chí 4: Hệ thống giám sát (Prometheus + Grafana) (1.5đ)
# ==============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: 'athena-library-monitor'

scrape_configs:
  # 1. Scrape Library Web Application (Application & Business Telemetry)
  - job_name: 'library_app'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['web:5000']
        labels:
          app: 'athena_library_core'
          environment: 'production'

  # 2. Scrape Prometheus Internals
  - job_name: 'prometheus'
    metrics_path: '/prometheus/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

  # 3. Scrape Nginx Metrics (via stub_status or logs)
  - job_name: 'loki'
    scrape_interval: 15s
    static_configs:
      - targets: ['loki:3100']
